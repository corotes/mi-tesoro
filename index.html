<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi mujeeer ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <div class="corazon">💕</div>

        <h1>Para el amor de mi vida</h1>

        <p class="mensaje">
            Hice este pequeño obsequio para mi mujer 💕💕.
        </p>

        <p class="submensaje">
            Para que sepas el amor tan inmenso que tengo por ti mi amor 💕💕.
        </p>


        <div class="botones">

            <button onclick="mostrarRecuerdo(1)">
                💌 Mi esposa
            </button>

            <button onclick="mostrarRecuerdo(2)">
                💖 Mi niña hermosa 💕💕
            </button>

            <button onclick="mostrarRecuerdo(3)">
                T AMOOO 💜💜
            </button>

        </div>


        <!-- AQUÍ APARECEN LA IMAGEN Y EL TEXTO -->

        <div id="recuerdo">

            <img id="imagen-amor" src="" alt="Foto especial">

            <h2 id="titulo-recuerdo"></h2>

            <p id="texto-recuerdo"></p>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
